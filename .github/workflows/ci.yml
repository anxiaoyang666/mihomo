name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# 两个任务都跑在飞牛自托管 runner（标签 self-hosted, xiguo）上：GitHub 托管 runner
# 受账单和分钟数限制。需先在本仓库注册 runner（建议名 xiguo-mihomo-1）。
# 回滚：runs-on 改回 ubuntu-latest，恢复 pip 缓存和 apt 安装 ShellCheck。
jobs:
  pytest:
    name: pytest
    runs-on: [self-hosted, xiguo]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Two frontend contract tests shell out to node and skip when it is missing.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run pytest
        run: python -m pytest tests/

  shellcheck:
    name: shellcheck
    runs-on: [self-hosted, xiguo]
    steps:
      - uses: actions/checkout@v4

      # 飞牛 runner 不用 sudo：ShellCheck 需预装在 runner 镜像里（authhub 的 runner 同样如此）。
      - name: Check ShellCheck is installed
        run: command -v shellcheck || { echo "runner 上没有 shellcheck，请在飞牛 runner 镜像里预装" >&2; exit 1; }

      # install.sh plus the scripts installed to /etc/mihomo/scripts.
      # --severity=warning: info/style notes in the existing scripts stay
      # visible locally but do not fail CI. SC1090/SC1091 are disabled in
      # .shellcheckrc (runtime .env is not in the repo).
      - name: Run ShellCheck
        run: shellcheck --severity=warning install.sh remote-root/etc/mihomo/scripts/*.sh
